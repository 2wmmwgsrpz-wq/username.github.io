<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Hochzeitswebsite der Keese-Snijders">
  <title>Keese-Snijders | Hochzeitswebsite</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      color: #172033;
      background: linear-gradient(135deg, #eef4ff 0%, #f8fbff 50%, #e8f7f3 100%);
    }

    main {
      width: min(620px, 100%);
      padding: 48px 32px;
      text-align: center;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(23, 32, 51, 0.08);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(35, 55, 90, 0.14);
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(2rem, 7vw, 3.5rem);
      line-height: 1.05;
    }

    p {
      margin: 0 auto 30px;
      max-width: 470px;
      color: #556176;
      font-size: 1.05rem;
      line-height: 1.6;
    }

    a.button {
      display: inline-block;
      padding: 14px 24px;
      color: #ffffff;
      background: #176b5b;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    a.button:hover,
    a.button:focus-visible {
      background: #0f5145;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <main>
    <h1>Wilkommen bei den Keese-Snijders!</h1>
    <p>Click auf den Link um zu unserer Hochzeitswebsite zu kommen</p>
    <a
      class="button"
      href="https://keesesnijders.wixsite.com/my-site"
      target="_blank"
      rel="noopener noreferrer"
    >
      Zur Hochzeitswebsite
    </a>
  </main>
</body>
</html>
